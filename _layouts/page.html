---
layout: default
---
<!-- page.html -->
        <div class="post">

          <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <!-- div, not p: markdownify emits block-level <p> which cannot nest in <p> -->
            <div class="post-description">{{ page.description | markdownify }}</div>
          </header>

          <article>
            {{ content }}
          </article>

        </div>
