<!-- _includes/papers.html -->
<div class="grid-sizer"></div>
<div class="grid-item">
  {% if paper.redirect -%}
  <a href="{{ paper.redirect }}">
    {%- else -%}
    <a href="{{ paper.url | relative_url }}">
      {%- endif %}
      <div class="card hoverable">
        {%- if paper.img %}
        {%- include figure.html
          path=paper.img
          alt="paper thumbnail" -%}
        {%- endif %}
        <div class="card-body">
          <h2 class="card-title text-lowercase">{{ paper.title }}</h2>
          <p class="card-text">{{ paper.description }}</p>
          <div class="row ml-1 mr-1 p-0">
            {%- if paper.github -%}
            <div class="github-icon">
              <div class="icon" data-toggle="tooltip" title="Code Repository">
                <a href="{{ paper.github }}"><i class="fab fa-github gh-icon"></i></a>
              </div>
              {%- if paper.github_stars -%}
              <span class="stars" data-toggle="tooltip" title="GitHub Stars">
                <i class="fas fa-star"></i>
                <span id="{{ paper.github_stars }}-stars"></span>
              </span>
              {%- endif %}
            </div>
            {%- endif %}
          </div>
        </div>
      </div>
    </a>
</div>
